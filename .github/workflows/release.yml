name: Release

# Tag-driven, matching the standing cadence: version bump -> PR -> merge ->
# tag -> release. Pushing a v*.*.* tag is the ONLY thing that publishes an
# image; nothing on a branch or PR can.
on:
  push:
    tags: ['v*.*.*']
  # Dry run. The verify job below is the risky half of a release -- it gates
  # on live Spotify, and nothing proves a GitHub runner is served the same
  # pages a workstation is until one actually tries. Dispatching this runs
  # verify alone, so that question gets answered before a tag is pushed
  # rather than by a failed release. `publish` is guarded to tag pushes, so a
  # dispatch can never publish anything.
  #
  # Only dispatchable once this file is on the default branch -- that is a
  # GitHub rule about workflow_dispatch, not a choice here.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A tag that disagrees with package.json ships an image that reports a
      # version nobody can find in git. Catch it before anything is published,
      # not after someone is trying to work out which build is deployed.
      - name: Tag must match package.json
        if: github.event_name == 'push'
        run: |
          declared="v$(node -p "require('./package.json').version")"
          if [ "$declared" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json ($declared)"
            exit 1
          fi
          echo "tag and package.json agree on $declared"

      - name: Type check
        run: npx tsc --noEmit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Offline suite
        run: npm test

      # The offline corpus is a snapshot; it cannot notice that Spotify
      # changed the page shape since it was recorded. That is the one failure
      # this service exists to absorb, so a release -- unlike CI, which stays
      # deterministic on purpose -- checks it against the live site before
      # publishing an image whose extraction may already be broken.
      #
      # This does couple releases to a third party. If Spotify is down or
      # rate-limiting, re-run this job once it recovers.
      - name: Live smoke suite
        run: npm run test:live

  publish:
    name: Publish image and release
    needs: verify
    # A dispatched run stops after verify. Only a v*.*.* tag publishes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # semver tags give consumers a choice of pin strictness: exact
          # (0.1.0), minor-floating (0.1), major-floating (0). `latest` is
          # attached automatically for a non-prerelease tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --generate-notes works out the previous tag on its own; passing
          # --notes-start-tag needs full history and has no sane fallback on
          # the very first release.
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes
