services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  sleevenote:
    build: .
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3000"
    ports:
      # This host's OWN address on the network you intend to serve -- never
      # 0.0.0.0, which would silently start publishing on any interface the
      # host later gains, and never a bare network address, which is not
      # assignable to a host and cannot be bound at all.
      #
      # No default on purpose: the service has no auth of its own, so where
      # it listens is a decision the operator has to make deliberately.
      - "${BIND_ADDR:?set BIND_ADDR in .env to this host's own private address}:3000:3000"
    depends_on: [redis]
    restart: unless-stopped
